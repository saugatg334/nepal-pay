# NGINX Production Security Configuration
# ===========================================
# Place in /etc/nginx/conf.d/security.conf

# Hide server version
server_tokens off;

# Security Headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Block access to sensitive files
location ~* \.(env|log|sql|backup|bak|yml|yaml|md)$ {
    deny all;
    return 404;
}

# Block common exploit paths
location ~* \.(git|svn|htaccess|htpasswd|idea|swp)$ {
    deny all;
    return 404;
}

# PHP settings
location ~ \.php$ {
    fastcgi_param PHP_VALUE "expose_php=off\n";
    fastcgi_hide_header X-Powered-By;
    
    # Timeouts
    fastcgi_read_timeout 30s;
    fastcgi_connect_timeout 30s;
    
    # Buffer sizes
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;
    
    # Security
    fastcgi_param PHP_VALUE "session.cookie_httponly=1\nsession.cookie_secure=1\nsession.cookie_samesite=Strict\n";
    
    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Apply rate limits
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 10;
}

location /api/auth/login {
    limit_req zone=login_limit burst=5 nodelay;
}

# Block request methods
if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$ ) {
    return 405;
}

# Block suspicious user agents
if ($http_user_agent ~* "sqlmap|nikto|nmap|masscan|zgrab") {
    return 403;
}

# Minimum TLS version
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

# OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;

# Security: prevent buffer overflow
client_body_buffer_size 128k;
client_max_body_size 1m;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
